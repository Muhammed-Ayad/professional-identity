# Copy this file to passwords.yaml and fill in your secrets.
# Do NOT commit passwords.yaml to git.

development:
  database: 'your_development_db_password'
  redis: 'your_development_redis_password'
  serviceSecret: 'your_development_service_secret'
  emailSecretHashPepper: 'your_development_email_secret_hash_pepper'
  jwtHmacSha512PrivateKey: 'your_development_jwt_hmac_sha512_private_key'
  jwtRefreshTokenHashPepper: 'your_development_jwt_refresh_token_hash_pepper'

test:
  database: 'your_test_db_password'
  redis: 'your_test_redis_password'
  emailSecretHashPepper: 'your_test_email_secret_hash_pepper'
  jwtHmacSha512PrivateKey: 'your_test_jwt_hmac_sha512_private_key'
  jwtRefreshTokenHashPepper: 'your_test_jwt_refresh_token_hash_pepper'

staging:
  database: 'your_staging_db_password'
  serviceSecret: 'your_staging_service_secret'
  emailSecretHashPepper: 'your_staging_email_secret_hash_pepper'
  jwtHmacSha512PrivateKey: 'your_staging_jwt_hmac_sha512_private_key'
  jwtRefreshTokenHashPepper: 'your_staging_jwt_refresh_token_hash_pepper'

production:
  database: 'your_production_db_password'
  serviceSecret: 'your_production_service_secret'
  emailSecretHashPepper: 'your_production_email_secret_hash_pepper'
  jwtHmacSha512PrivateKey: 'your_production_jwt_hmac_sha512_private_key'
