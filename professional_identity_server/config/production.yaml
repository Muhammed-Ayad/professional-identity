# This is the configuration file for your production environment.
# Typically, you will want to route the traffic through a load balancer
# which adds SSL security through https. If you use Serverpod's standard
# Terraform scripts to deploy your server, all you need to change in
# this file is the examplepod.com domain name.

# Configuration for the main API server.
# Overridable via SERVERPOD_API_SERVER_PORT, SERVERPOD_API_SERVER_PUBLIC_HOST, etc.
apiServer:
  port: 8080
  publicHost: api.professionalidentity.dev
  publicPort: 443
  publicScheme: https

# Configuration for the Insights server.
insightsServer:
  port: 8081
  publicHost: insights.professionalidentity.dev
  publicPort: 443
  publicScheme: https

# Configuration for the web server (serves web app, SEO tags, health checks).
# Overridable via SERVERPOD_WEB_SERVER_PORT, SERVERPOD_WEB_SERVER_PUBLIC_HOST, etc.
webServer:
  port: 8082
  publicHost: app.professionalidentity.dev
  publicPort: 443
  publicScheme: https

# Database configuration.
# Overridable via SERVERPOD_DATABASE_HOST, SERVERPOD_DATABASE_PORT,
# SERVERPOD_DATABASE_NAME, SERVERPOD_DATABASE_USER, SERVERPOD_DATABASE_PASSWORD.
database:
  host: database.private-production.professionalidentity.dev
  port: 5432
  name: professional_identity
  user: postgres
  requireSsl: true
  #isUnixSocket: true # defaults to false
  #maxConnectionCount: 10 # Defaults to 10, a negative or null value removes the limit

# This is the setup for Redis. The default for the Google Cloud Engine Terraform
# configuration is to connect on a private IP address.
# If you are connecting on a public IP (e.g. on AWS or Google Cloud Run), you
# connect on the public IP of the database e.g. redis.examplepod.com.
redis:
  enabled: false
  host: redis.private-production.examplepod.com
  port: 6379
  #user: # defaults to empty
  #requireSsl: true # defaults to false

maxRequestSize: 6291456 # The maximum size of requests allowed in bytes (6 MB for 5 MB PDF uploads)

sessionLogs:
  consoleEnabled: false
# persistentEnabled: true
# consoleLogFormat: json # Defaults to "json", options are "text" or "json"

# futureCallExecutionEnabled: true # Defaults to true

#futureCall:
#  concurrencyLimit: 1 # Defaults to 1, a negative or null value removes the limit
#  scanInterval: 5000 # Unit in milliseconds, defaults to 5000

# Recommended when serving web clients: keeps auth tokens in httpOnly
# cookies. Without this, web tokens live in JavaScript-readable storage,
# where any XSS can steal them. Web clients opt in with
# `client.cookieAuth = true`. Requires `allowedOrigins`; browsers from
# origins not in the list lose cross-origin access, including to public
# endpoints.
#authCookie:
#  sameSite: lax # Defaults to "lax", options are "strict" or "none"
#  #name: serverpod_auth # Defaults to "serverpod_auth"
#  #refreshName: serverpod_auth_refresh # Defaults to "<name>_refresh"
#  #domain: professionalidentity.dev # Defaults to host-only; set to share across subdomains
#  #path: / # Defaults to "/"
#  #secure: true # Defaults to true; the cookie is only sent over https
#allowedOrigins:
#  - https://app.professionalidentity.dev # The origin serving your Flutter web app
